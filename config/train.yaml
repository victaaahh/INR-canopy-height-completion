run_group: ???
run_name: ${now:%Y-%m-%d}T${now:%H:%M:%S}

defaults:
  - model: fourier_features
  - optimizer@target_optimizer: adam
  - optimizer@guide_optimizer: adam
  - optimizer@joint_optimizer: adam
  - _self_

epochs1: 1000
fit1: jointly # target, guide, jointly

epochs2: null
fit2: null

device: cuda
save_canopy_height_maps: true
save_guide_images: true
save_running_metrics: true
full_image_metrics_interval: 10
target_loss_weight: 0.5 # loss weights are used when jointly fitting
guide_loss_weight: 0.5

target_criterion:
  _target_: torch.nn.MSELoss

guide_criterion:
  _target_: torch.nn.MSELoss

metrics: # metrics are computed on rescaled/non-normalized output
  - PSNR:
      _target_: src.utils.metrics.PSNR
      data_range: 6000
  - RMSE:
      _target_: src.utils.metrics.RMSE
  - MAE:
      _target_: torch.nn.L1Loss
  - ME:
      _target_: src.utils.metrics.ME
  - R2:
      _target_: src.utils.metrics.R2
  - full_window_SSIM:
      _target_: src.utils.metrics.full_window_SSIM
      data_range: 6000
      k_1: 0.01
      k_2: 0.03

full_image_metrics:
  - SSIM:
      _target_: src.utils.metrics.SSIM
      data_range: 6000
      k_1: 0.01
      k_2: 0.03
      gaussian_kernel: true
      sigma: 1.5
      kernel_size: 11
      device: ${device}

data:
  opencanopy_indices: [42, 262, 488, 819, 1043]
  test_grid_skip: 2
  sparsity: 0.5
  target_normalization_shift: 58.85
  target_normalization_scale: 85.56
  guide_normalization_shift: 0.0
  guide_normalization_scale: 256.0
  nan_above: 600
  full_image_metrics_fill_na: 0.0

hydra:
  run:
    dir: ./outputs/${run_group}/${run_name}
  sweep:
    dir: ./outputs/${run_group}
    subdir: ${run_name}
