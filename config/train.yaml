run_group: ???
run_name: ${now:%Y-%m-%d}T${now:%H:%M:%S}

defaults:
  - model: fourier_features
  - optimizer: adam
  - _self_

device: cuda
epochs: 1000
save_images: true
save_running_metrics: true
full_image_metrics_interval: 10

criterion:
  _target_: torch.nn.MSELoss

metrics: # metrics are computed on rescaled/non-normalized output
  - PSNR:
      _target_: src.utils.metrics.PSNR
      data_range: 6000
  - RMSE:
      _target_: src.utils.metrics.RMSE
  - MAE:
      _target_: torch.nn.L1Loss
  - ME:
      _target_: src.utils.metrics.ME
  - R2:
      _target_: src.utils.metrics.R2
  - full_window_SSIM:
      _target_: src.utils.metrics.full_window_SSIM
      data_range: 6000
      k_1: 0.01
      k_2: 0.03

full_image_metrics:
  - SSIM:
      _target_: src.utils.metrics.SSIM
      data_range: 6000
      k_1: 0.01
      k_2: 0.03
      gaussian_kernel: true
      sigma: 1.5
      kernel_size: 11
      device: ${device}

data:
  split: train
  opencanopy_indices: [42, 262, 488, 819, 1043]
  test_grid_skip: 2
  sparsity: 0.5
  normalization_shift: 58.85
  normalization_scale: 85.56
  nan_above: 600
  full_image_metrics_fill_na: 0.0
  zero_ratio_cutoff: 0.99

dataloader:
  batch_size:
    full
    # if batch_size is "full", a dataloader is not used at all and fitting is way faster.
    # smaller sizes are only potentially useful for regularization and only used when fitting
  shuffle: true

hydra:
  run:
    dir: ./outputs/${run_group}/${run_name}
  sweep:
    dir: ./outputs/${run_group}
    subdir: ${run_name}
