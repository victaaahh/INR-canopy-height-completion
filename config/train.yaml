run_group: ???
run_name: ${now:%Y-%m-%d}T${now:%H:%M:%S}

defaults:
  - model: fourier_features
  - optimizer: adam
  - _self_

epochs: 1000
save_images: true
save_running_metrics: true

criterion:
  _target_: torch.nn.MSELoss

metrics:
  - PSNR:
      _target_: src.utils.metrics.PSNR
      data_range: 1.0 # should be 1 if normalizing images
  - RMSE:
      _target_: src.utils.metrics.RMSE
  - MAE:
      _target_: torch.nn.L1Loss
  - ME:
      _target_: src.utils.metrics.ME
  - R2:
      _target_: src.utils.metrics.R2

data:
  opencanopy_indices: [42, 262, 488, 819, 1043]
  normalize_image: true # data range in metrics should match choice here
  test_grid_skip: 3
  sparsity: 0.5

dataloader:
  batch_size: full # if batch_size is "full", a dataloader is not used at all
  shuffle: true

hydra:
  run:
    dir: ./outputs/${run_group}/${run_name}
  sweep:
    dir: ./outputs/${run_group}
    subdir: ${run_name}
