[project]
name = "inr-canopy-height-completion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1.3",
    "hydra-core>=1.3.2",
    "hydra-optuna-sweeper>=1.2.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "omegaconf>=2.3.0",
    "pandas>=2.3.3",
    "rasterio>=1.4.4",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
    "wandb>=0.25.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
